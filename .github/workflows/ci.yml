name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Heavy ML deps (torch, faiss, sentence-transformers) are imported
      # lazily/optionally and the store falls back to NumPy search, so the
      # test suite doesn't need them — but it does need every lightweight
      # dependency the auth/db/jobs modules import directly.
      - run: pip install numpy pytest pyjwt bcrypt python-dotenv sqlalchemy redis rq fastapi
      # `pytest` alone (the console script) doesn't add the repo root to
      # sys.path, so `import rag_chatbot` fails; `python -m pytest` does.
      - run: python -m pytest -v
