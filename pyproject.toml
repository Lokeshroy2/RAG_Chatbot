[project]
name = "rag-chatbot"
version = "2.0.0"
description = "Fully local, multi-document RAG chatbot (FastAPI + FAISS + Ollama)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["__pycache__"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  "B008", # FastAPI's `File(...)` in argument defaults is idiomatic
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
